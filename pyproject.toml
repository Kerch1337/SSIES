[project]
name = "ssies"
version = "0.1.2"
description = "Library for parcing data SSIES detector DMSP mission"
readme = "README.md"
authors = [{name="Kirill"}]
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netCDF4"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

